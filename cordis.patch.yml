# dsh-team-janitor — Host plugin registration for DeepSeek Harness.
# One Host plugin row; per-row config lives in the patch layer and survives upgrades.
#
# Optional config (no `Config` schema is declared, so the patch value is passed
# to `apply(ctx, config)` as-is; there is no rendered form field for it):
#
#   config:
#     persistResults: false   # default true: mirror results to <DSH_HOME>/team-janitor/results.json
#
#   - insert:
#       - id: team-janitor
#         name: 'dsh-team-janitor'
#         config: {}
- insert:
    - id: team-janitor
      name: 'dsh-team-janitor'
      config: {}
